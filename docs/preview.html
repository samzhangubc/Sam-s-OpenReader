<script>
"use strict";
const $=s=>document.querySelector(s), langNames=['English','简体中文','繁體中文'];
const groups={
 'Shelf':{library:['Library','Open a book or use Import to preview a private library copy.'],details:['Book details','Inspect formats, original copies and saved positions.'],importer:['Import book','Try the sample TXT import with Open once or Add to library.'],encoding:['Text encoding','Compare a clean preview with a decoding error.'],transfer:['Export & restore','Inspect the difference between an original, an edited TXT and a backup.']},
 'Reading':{reader:['Reader','Drag or swipe left for next, right for previous. Tap the middle to toggle the bars.'],contents:['Contents','Jump to a chapter.'],progress:['Reading progress','Choose a destination before jumping.'],search:['Search & bookmarks','Search the sample or save a location.'],appearance:['Appearance','Try a typeface, type size and paper color.'],animation:['Page-turn animation','Choose a mode, then try it on the reader.']},
 'TXT tools':{chapters:['Chapter detection','Preview simple heading rules, count matches and exclude false positives.'],cleanup:['Text cleanup','Preview a literal replacement or deletion before applying it to the sample.'],history:['Revision history','Undo the last cleanup and compare the original.']},
 'Listening & settings':{listen:['Listen','Try the speed, voice and timer controls with simulated playback.'],system:['Lock screen player','Review media controls with the reader off-screen.'],settings:['Settings','Switch interface language, theme or simulated voice availability.']}};
const screens=Object.assign({},...Object.values(groups));
const s={view:'library',lang:0,book:0,page:0,bars:true,mode:'Slide',font:'Serif',size:18,paper:'#fcf8ed',ink:'#263b31',dark:false,library:[0,1,2],own:true,codec:'UTF-8',rule:'auto',skipped:new Set(),chap:[0,1,2],work:[],hist:[],q:'',find:'harbour',rep:'port',speed:1,timer:'Off',voice:true,playing:false,mark:new Set(),exportMode:'original',returnPage:null};
const L=(en,hans,hant)=>[en,hans,hant][s.lang];
const titles=['The Quiet Harbour','山间来信','Field Atlas'], formats=['TXT','EPUB','PDF'], authors=['Mira Lin','林青','Ellis Reed'];
const source=['The ferry came in before sunrise. From the harbour wall, Mei watched its windows drift across the water like a second row of stars.','She unfolded the map. Where the harbour should have been, someone had drawn a small door in green ink. There was no key.','At low tide, Mei found three smooth steps cut into the quay. On the last step lay a dry envelope with her name on it.','Inside was a list of all the ships that had left the harbour in winter. The last line was in her own handwriting.','By morning the fog had lifted. Across the harbour a bell rang twice, and she knew exactly which boat to take.','She took the map and left her lantern on the wall for whoever came after her.'];
const prose=[source,['雨停以后，阿青走进山谷。小径尽头的树上挂着一封信。','纸上只有一行字：请在黄昏前回来。','她沿着溪水往前走，桥边有人正在等她。','遠山映在水面上，一隻白鷺掠過石橋。','她想起了那封信，便停下來聽了一會兒風聲。','天色將晚，她慢慢走上歸途。'],['Plate I. Estuary sediments form narrow bands where fresh water meets the tide.','Plate II. The upper ledge remains dry except during the largest spring tides.','Plate III. Sample the shaded face of the outcrop.','Plate IV. Fine grains settle in the lee of the headland.','Plate V. Revisit the shoreline after the first storm.','Plate VI. Record your observations at the same tide height.']];
const headings=[['Chapter 1 · The ferry','Chapter 2 · Low tide','Chapter 3 · Homeward'],['第一章 山谷','第二章 石桥','第三章 歸途'],['Estuary','Outcrops','Shoreline']];
s.work=source.slice(); const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const t={library:()=>L('Library','书库','書庫'),details:()=>L('Book details','书籍详情','書籍詳情'),importer:()=>L('Import book','导入书籍','匯入書籍'),encoding:()=>L('Text encoding','文本编码','文字編碼'),transfer:()=>L('Export & restore','导出与还原','匯出與還原'),reader:()=>L('Read','阅读','閱讀'),contents:()=>L('Contents','目录','目錄'),progress:()=>L('Reading progress','阅读进度','閱讀進度'),search:()=>L('Search & bookmarks','搜索与书签','搜尋與書籤'),appearance:()=>L('Appearance','外观','外觀'),animation:()=>L('Page-turn animation','翻页动画','翻頁動畫'),chapters:()=>L('Chapter detection','章节识别','章節辨識'),cleanup:()=>L('Text cleanup','批量替换','批次取代'),history:()=>L('Revision history','修订记录','修訂記錄'),listen:()=>L('Listen','朗读','朗讀'),system:()=>L('Lock screen','锁屏','鎖定畫面'),settings:()=>L('Settings','设置','設定')};
const more=()=>L('More','更多','更多'),back=()=>L('Back','返回','返回'),apply=()=>L('Apply','应用','套用');
function button(label,code,cl='secondary'){return '<button class="'+cl+'" onclick="'+code+'">'+esc(label)+'</button>'}
function go(id,label,cl){return button(label||t[id](),"goto('"+id+"')",cl)}
function options(items,val){return items.map(([k,v])=>'<option value="'+esc(k)+'" '+(String(k)===String(val)?'selected':'')+'>'+esc(v)+'</option>').join('')}
function select(label,id,items,val,code){return '<label for="'+id+'">'+label+'</label><select id="'+id+'" onchange="'+code+'">'+options(items,val)+'</select>'}
function cover(id){return '<div aria-hidden="true" class="cover c'+id+'">'+['Quiet<br>Harbour','山間<br>來信','Field<br>Atlas'][id]+'</div>'}
function chooseBook(id){s.own=true;s.book=id;s.page=0;s.bars=true;s.returnPage=null;goto('reader')}
function notify(msg){const box=document.createElement('div');box.className='toast';box.role='status';box.textContent=msg;$('#app').append(box);setTimeout(()=>box.remove(),1700)}
function footerNav(){return '<nav class="bottom">'+go('library',null,'')+go('importer',null,'')+go('settings',null,'')+'</nav>'}
function shell(title,body,prev='library'){return '<div class="top">'+(s.view==='library'?'<strong>OpenReader</strong>':button('‹',"goto('"+prev+"')",'icon'))+(s.view==='library'?go('settings','⚙','icon'):'<strong>OpenReader</strong>')+'</div><div class="scroll"><h1>'+title+'</h1>'+body+'</div>'+footerNav()}
function linkrow(id){return '<button class="choice" onclick="goto(\''+id+'\')"><b>'+t[id]()+'</b>›</button>'}
function items(){return (s.book===0?s.work:prose[s.book])}
function chapters(){return s.book===0?s.chap:[0,1,2]}
function sectionAt(p){const cs=chapters();return cs.filter(n=>n*2<=p).at(-1)??0}
function jumpPage(p){s.returnPage=s.page;s.page=Number(p);goto('reader')}
function page(p){const title=headings[s.book][sectionAt(p)],body=items()[p];return '<article class="page" style="background:'+s.paper+';color:'+s.ink+';font-family:'+(s.font==='Serif'?'var(--serif)':'system-ui')+';font-size:'+s.size+'px"><div class="eyebrow">'+esc(titles[s.book])+'</div><h2>'+esc(title)+'</h2><p>'+esc(body)+'</p></article>'}
function baseReader(chrome){const cs=chapters(),ch=sectionAt(s.page),ci=cs.indexOf(ch),n=cs[ci+1]??3;
const meta=s.book===2?L('Page','页','頁')+' '+(s.page+1)+'/6':L('Ch','章','章')+' '+(ci+1)+'/'+cs.length+'　'+L('Page','页','頁')+' '+(s.page-ch*2+1)+'/'+(n*2-ch*2);
return '<div class="reading" style="background:'+s.paper+'"><div class="canvas" id="canvas" aria-label="Page gestures">'+page(s.page)+'</div><div class="footer" style="color:'+s.ink+'">'+meta+'　·　'+Math.round(s.page/5*100)+'%</div>'+(chrome?'<div class="rbar top">'+go('library','‹','icon')+button(titles[s.book],"goto('details')",'pill')+go('details','⋯','icon')+'</div><nav class="rbar bottom">'+go('contents',null,'')+go('progress','%','')+go('appearance','Aa','')+go('listen',null,'')+'</nav>':'')+'</div>'}
function sheet(id,body){return baseReader(false)+'<div class="sheetback" onclick="goto(\'reader\')"></div><section class="sheet"><div class="row"><h2>'+t[id]()+'</h2>'+go('reader','×','icon')+'</div>'+body+'</section>'}
function textInput(id,val){return '<input type="text" id="'+id+'" value="'+esc(val)+'">'}
function chapterPage(){const raw=['Chapter 1 · The ferry','Chapter 2 · Low tide','Chapter 3 · Homeward'];const test=s.rule==='custom'?line=>line.toLowerCase().startsWith((s.prefix??'Chapter').toLowerCase()):()=>true;
const matches=raw.map((h,i)=>[h,i]).filter(([h])=>test(h));s.candidates=matches.map(x=>x[1]);
return shell(t.chapters(),select(L('Heading rule','标题规则','標題規則'),'rule',[['auto',L('Numbered headings','编号标题','編號標題')],['custom',L('Starts with…','开头为…','開頭為…')]],s.rule,"s.rule=this.value;render()")+(s.rule==='custom'?'<label for="prefix">'+L('Prefix','前缀','前綴')+'</label>'+textInput('prefix',s.prefix??'Chapter')+button(L('Rescan','重新扫描','重新掃描'),"s.prefix=$('#prefix').value;render()",'pill'):'')+'<div class="sectionname eyebrow">'+matches.length+' '+L('candidates','个候选标题','個候選標題')+'</div>'+matches.map(([h,i])=>'<label class="choice"><input type="checkbox" '+(s.skipped.has(i)?'':'checked')+' onchange="this.checked?s.skipped.delete('+i+'):s.skipped.add('+i+')">'+esc(h)+'</label>').join('')+button(apply(),"applyChapters()",'primary'),'details')}
function applyChapters(){s.chap=[...new Set([0,...s.candidates.filter(i=>!s.skipped.has(i))])].sort();s.book=0;s.view==='chapters'&&goto('reader')}
function countHits(){return s.find?s.work.reduce((n,v)=>n+v.split(s.find).length-1,0):0}
function previewEdit(){s.find=$('#find').value;s.rep=$('#rep').value;render()}
function edit(){if(!countHits())return;s.hist.push(s.work.slice());s.work=s.work.map(v=>v.split(s.find).join(s.rep));goto('history')}
function bookmarks(){return [...s.mark].filter(k=>k.startsWith(s.book+'-')).map(k=>Number(k.split('-')[1]))}
function screensBody(id){switch(id){
case 'library':return shell(t.library(),'<div class="eyebrow">'+L('Continue reading','继续阅读','繼續閱讀')+'</div><button class="hero" onclick="chooseBook(0)">'+cover(0)+'<div><small>TXT · Mira Lin</small><h2>The Quiet Harbour</h2><div class="meter"><i></i></div><small>'+L('Open book','打开书籍','開啟書籍')+' →</small></div></button><div class="shelfhead"><h2>'+L('On your shelf','书架','書架')+'</h2>'+go('importer','＋ '+L('Import','导入','匯入'),'pill')+'</div>'+s.library.map(i=>'<button class="bookrow" onclick="chooseBook('+i+')">'+cover(i)+'<span><b>'+titles[i]+'</b><small>'+authors[i]+'</small></span><em>'+formats[i]+'</em></button>').join('')+linkrow('transfer'));
case 'details':return shell(t.details(),'<div class="hero">'+cover(s.book)+'<div><small>'+formats[s.book]+' · '+authors[s.book]+'</small><h2>'+titles[s.book]+ '</h2></div></div>'+(s.own?'':'<div class="panel">'+L('Open once','仅打开','僅開啟')+' · '+button(L('Keep a library copy','保留书库副本','保留書庫副本'),"s.own=true;render()",'pill')+'</div>')+go('reader',t.reader(),'primary')+linkrow('search')+(s.book===0?linkrow('chapters')+linkrow('cleanup')+linkrow('history'):'')+linkrow('transfer'),'reader');
case 'importer':return shell(t.importer(),'<p class="small">'+L('Select a sample file from Downloads.','从下载文件夹选择示例文件。','從下載資料夾選擇範例檔案。')+'</p>'+select(L('File','文件','檔案'),'file',titles.map((v,i)=>[i,v+'.'+formats[i].toLowerCase()]),s.book,"s.book=+this.value;s.page=0;render()")+'<div class="panel">'+L('A library copy stays on this device if the source file changes.','源文件更改后，书库副本仍保留。','來源檔案更改後，書庫副本仍會保留。')+'</div><div class="actionbar">'+button(L('Open once','仅打开','僅開啟'),"s.own=false;startImport()")+button(L('Add to library','加入书库','加入書庫'),"s.own=true;startImport()",'primary')+'</div>');
case 'encoding':return shell(t.encoding(),select(L('Decode as','编码','編碼'),'codec',['UTF-8','GB18030','Big5'].map(v=>[v,v]),s.codec,"s.codec=this.value;render()")+'<div class="panel">'+(s.codec==='UTF-8'?esc(source[0]):L('Encoding mismatch in this sample. Choose UTF-8.','示例编码不匹配，请选择 UTF-8。','範例編碼不符，請選擇 UTF-8。'))+'</div>'+(s.codec==='UTF-8'?go('chapters',t.chapters()+' →','primary'):''),'importer');
case 'reader':return baseReader(s.bars);

case 'cleanup':{const hits=countHits(),sample=s.work.find(v=>s.find&&v.includes(s.find));return shell(t.cleanup(),'<label for="find">'+L('Find throughout book','全文查找','全文尋找')+'</label>'+textInput('find',s.find)+'<label for="rep">'+L('Replace with (blank deletes)','替换为（留空即删除）','取代為（留空即刪除）')+'</label>'+textInput('rep',s.rep)+button(L('Preview matches','预览匹配','預覽相符項目'),"previewEdit()",'pill')+'<div id="diff" class="result"><b>'+hits+' '+L('matches','处匹配','處相符')+'</b>'+(sample?'<p>'+esc(sample)+'</p><p>'+esc(sample.split(s.find).join(s.rep))+'</p>':'')+'</div>'+(hits?button(apply(),"edit()",'primary'):'')+linkrow('history'),'details')}

function toggleMark(){const k=s.book+'-'+s.page;s.mark.has(k)?s.mark.delete(k):s.mark.add(k);render()}
function startImport(){s.page=0;s.bars=true;goto(s.book===0?'encoding':'reader')}
function adjustRate(step){
  s.speed=Math.max(.5,Math.min(3,(Math.round(s.speed*10)+step)/10));
  render();
}
function syncReader(){const old=$('#canvas');if(old)old.innerHTML=page(s.page)}
function setLang(i){s.lang=i;render()}
function goto(id){s.view=id;if(['chapters','cleanup','history','encoding'].includes(id))s.book=0;render()}
function render(){document.documentElement.lang=['en','zh-Hans','zh-Hant'][s.lang];$('#device').classList.toggle('dark',s.dark);$('#app').innerHTML=screensBody(s.view);$('#ntitle').textContent=screens[s.view][0];$('#note').textContent=screens[s.view][1];$('#jump').value=s.view;$('#mlang').value=$('#dlang').value=s.lang;
document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.screen===s.view));if(s.view==='reader')gestures();
if(s.view==='cleanup')for(const input of [$('#find'),$('#rep')])input.addEventListener('input',()=>{ $('#diff').hidden=true;const b=$('.scroll .primary');if(b)b.hidden=true;});}
function gestures(){const el=$('#canvas');let x,y,dx,dy,dir=0,moved=false,busy=false,front,other,active;
function layers(d){if(d===dir)return;other?.remove();other=null;dir=d;front=el.firstElementChild;front.style.transform='';const np=s.page+d;if(np<0||np>=items().length)return;el.insertAdjacentHTML('beforeend',page(np));other=el.lastElementChild;front.style.zIndex=s.mode==='Uncover'?2:1;other.style.zIndex=s.mode==='Uncover'?1:2}
function paint(px){if(!front||!other)return;const distance=el.clientWidth;const mode=matchMedia('(prefers-reduced-motion: reduce)').matches?'None':s.mode;other.hidden=mode==='None';front.style.transform='translateX('+(mode==='Slide'||mode==='Uncover'?px:0)+'px)';other.style.transform='translateX('+(mode==='Slide'||mode==='Cover'?dir*distance+px:0)+'px)'}
function settle(ok){if(!other){render();return}busy=true;const mode=matchMedia('(prefers-reduced-motion: reduce)').matches?'None':s.mode;const ms=mode==='None'?0:160;[front,other].forEach(node=>node.style.transition='transform '+ms+'ms ease-out');paint(ok?-dir*el.clientWidth:0);setTimeout(()=>{if(!el.isConnected)return;if(ok)s.page+=dir;render()},ms)}
el.onpointerdown=e=>{if(busy||!e.isPrimary)return;active=e.pointerId;x=e.clientX;y=e.clientY;dx=dy=0;el.setPointerCapture(active);moved=false};
el.onpointermove=e=>{if(e.pointerId!==active||busy)return;dx=e.clientX-x;dy=e.clientY-y;if(Math.abs(dx)<6&&!moved)return;if(Math.abs(dy)>Math.abs(dx)&&!moved)return;moved=true;layers(dx<0?1:-1);paint(Math.sign(dx)*Math.min(Math.abs(dx),el.clientWidth))};
el.onpointercancel=()=>{active=null;render()};el.onpointerup=e=>{if(e.pointerId!==active||busy)return;active=null;if(!moved){if(Math.abs(dy)>12)return;const f=(e.clientX-el.getBoundingClientRect().left)/el.clientWidth;if(f>=.3&&f<=.7){s.bars=!s.bars;render()}else{layers(f<.3?-1:1);paint(0);el.offsetWidth;settle(true)}}else settle(Math.abs(dx)>el.clientWidth/3)};}
const menus=Object.entries(groups);$('#nav').innerHTML=menus.map(([g,items])=>'<h2>'+g+'</h2>'+Object.entries(items).map(([id,[v]])=>'<button data-screen="'+id+'" onclick="goto(\''+id+'\')">'+v+'</button>').join('')).join('');$('#jump').innerHTML=menus.map(([g,items])=>'<optgroup label="'+g+'">'+Object.entries(items).map(([id,[v]])=>'<option value="'+id+'">'+v+'</option>').join('')+'</optgroup>').join('');$('#jump').onchange=e=>goto(e.target.value);for(const el of [$('#dlang'),$('#mlang')]){el.innerHTML=options(langNames.map((v,i)=>[i,v]),0);el.onchange=e=>setLang(+e.target.value)}render();
</script></html>
