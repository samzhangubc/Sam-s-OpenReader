plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.devtools.ksp'
}

android {
    namespace 'org.sam.openreader'
    compileSdk 36
    defaultConfig {
        applicationId 'org.sam.openreader'
        minSdk 29
        targetSdk 36
        versionCode 2
        versionName '0.2.0-preview.1'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildTypes {
        debug {
            applicationIdSuffix '.debug'
        }
    }
    buildFeatures { compose true }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
        freeCompilerArgs += ['-opt-in=org.readium.r2.shared.ExperimentalReadiumApi', '-opt-in=androidx.compose.material3.ExperimentalMaterial3Api']
    }
    sourceSets.main.assets.srcDir("$buildDir/generated/bookAssets")
    packaging.resources.excludes += ['META-INF/DEPENDENCIES', 'META-INF/INDEX.LIST']
}

dependencies {
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.fragment:fragment-ktx:1.8.7'
    implementation 'androidx.compose.material3:material3:1.3.2'
    implementation 'androidx.room:room-runtime:2.7.1'
    implementation 'androidx.room:room-ktx:2.7.1'
    ksp 'androidx.room:room-compiler:2.7.1'
    implementation 'androidx.datastore:datastore-preferences:1.1.7'
    implementation 'org.readium.kotlin-toolkit:readium-streamer:3.1.2'
    implementation 'org.readium.kotlin-toolkit:readium-navigator:3.1.2'
    implementation 'com.google.re2j:re2j:1.8'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'org.jetbrains.kotlin:kotlin-stdlib:2.1.21'
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4:1.8.2'
    debugImplementation 'androidx.compose.ui:ui-test-manifest:1.8.2'
}
tasks.register('prepareBookFonts', Exec) {
    inputs.files(rootProject.file('tools/fonts.lock.json'), rootProject.file('tools/fonts.py'))
    outputs.dir("$buildDir/generated/bookAssets/fonts")
    commandLine 'python', rootProject.file('tools/fonts.py')
}
tasks.named('preBuild').configure { dependsOn 'prepareBookFonts' }
