plugins { id 'com.android.application' }
android {
    namespace 'org.sam.openreader'
    compileSdk 35
    defaultConfig {
        applicationId 'org.sam.openreader'
        minSdk 35
        targetSdk 35
        versionCode 1
        versionName '0.1.0-alpha.1'
        testInstrumentationRunner 'org.sam.openreader.SmokeInstrumentation'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
