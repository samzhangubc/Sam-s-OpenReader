name: Android build
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: gradle :app:assembleDebug :app:lintDebug
      - name: Enable emulator acceleration
        run: sudo chmod a+rw /dev/kvm
      - name: Device smoke test
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 10
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: |
            gradle :app:installDebug :app:installDebugAndroidTest
            adb shell pm grant org.sam.openreader android.permission.POST_NOTIFICATIONS
            adb shell am instrument -w org.sam.openreader.test/org.sam.openreader.SmokeInstrumentation | tee smoke.log
            grep -q 'PASS: library' smoke.log
      - uses: actions/upload-artifact@v4
        with:
          name: OpenReader-alpha-apk
          path: app/build/outputs/apk/debug/app-debug.apk
