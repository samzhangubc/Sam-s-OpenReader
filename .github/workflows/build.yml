name: Android verification
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: bash gradlew :app:testDebugUnitTest :app:assembleDebug :app:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: OpenReader-device-test-build
          path: app/build/outputs/apk/debug/app-debug.apk
      - run: sudo chmod a+rw /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          disable-animations: true
          script: bash gradlew :app:connectedDebugAndroidTest || (adb logcat -d -s AndroidRuntime:E > emulator-errors.txt && exit 1)
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: device-test-reports
          path: |
            emulator-errors.txt
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
